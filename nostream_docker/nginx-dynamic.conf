events {
    worker_connections 1024;
}

http {
    # 上游服务器列表（动态端口）
    upstream chatbot_cluster {
        # 启用保持连接
        keepalive 32;

        # 使用最少连接算法
        least_conn;

        # 定义所有实例
        server host.docker.internal:8171 max_fails=3 fail_timeout=30s;
        server host.docker.internal:8172 max_fails=3 fail_timeout=30s;
        server host.docker.internal:8173 max_fails=3 fail_timeout=30s;
        server host.docker.internal:8174 max_fails=3 fail_timeout=30s;

        # 或者使用服务发现（如果使用 Docker DNS）
        # server chatbot:8177 resolve;
    }

    server {
        listen 80;
        server_name localhost;

        # 访问日志添加实例标识
        log_format upstreamlog '[$time_local] $remote_addr -> $upstream_addr ($upstream_response_time) "$request" $status';
        access_log /var/log/nginx/access.log upstreamlog;

        location / {
            proxy_pass http://chatbot_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 添加响应头标识实例
            proxy_set_header X-Upstream-Host $upstream_addr;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 缓冲设置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # 健康检查端点
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 查看集群状态
        location /cluster/status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}